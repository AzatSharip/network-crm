name: Quality and safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: crm_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://crm_app:synthetic-ci-app@localhost:5432/crm_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@localhost:5432/crm_ci
      APP_ORIGIN: http://localhost:8080
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.5', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: PGPASSWORD=synthetic-ci-only psql -h localhost -U postgres -d crm_ci -c "CREATE ROLE crm_app LOGIN PASSWORD 'synthetic-ci-app' NOSUPERUSER NOBYPASSRLS"
      - run: python scripts/test.py
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: pip-audit -r backend/requirements.txt
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - name: Browser scenarios against real API and PostgreSQL
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          CRM_SEED_SYNTHETIC=yes python scripts/seed-demo.py
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/crm-api.log" 2>&1 &
          npm --prefix frontend run dev -- --port 8080 > "$RUNNER_TEMP/crm-web.log" 2>&1 &
          frontend/node_modules/.bin/playwright install --with-deps chromium
          python scripts/run-e2e.py
      - run: python scripts/check-repository.py
      - name: Scan complete commit history with Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact
